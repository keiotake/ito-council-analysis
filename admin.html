<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>みんなの伊東市 - 投稿モデレーション</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f7;color:#1a1a1a;line-height:1.7;padding:1.5rem;max-width:900px;margin:0 auto}
  h1{font-size:1.4rem;margin-bottom:1.2rem;color:#0a0a0a}
  .auth-box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
  .auth-box label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem;color:#475569}
  .auth-box input{width:100%;padding:.6rem .8rem;border:2px solid #e5e7eb;border-radius:8px;font-size:.95rem;outline:none}
  .auth-box input:focus{border-color:#2563eb}
  .btn{padding:.6rem 1.2rem;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:.7rem}
  .btn:hover{background:#1e40af}
  .btn.approve{background:#10b981}
  .btn.reject{background:#ef4444}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .post{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #94a3b8;border-radius:10px;padding:1.1rem 1.3rem;margin-bottom:.8rem}
  .post.pending{border-left-color:#f59e0b;background:#fffbeb}
  .post.approved{border-left-color:#10b981}
  .post.rejected{border-left-color:#ef4444;opacity:.6}
  .post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;flex-wrap:wrap;gap:.5rem}
  .post-status{font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:#94a3b8;color:#fff;text-transform:uppercase;letter-spacing:.05em}
  .post-status.pending{background:#f59e0b}
  .post-status.approved{background:#10b981}
  .post-status.rejected{background:#ef4444}
  .post-meta{font-size:.72rem;color:#64748b}
  .post-title{font-size:1rem;font-weight:700;margin-bottom:.3rem;color:#0a0a0a}
  .post-body{font-size:.88rem;color:#1e293b;white-space:pre-wrap;margin-bottom:.6rem;padding:.6rem;background:#f9fafc;border-radius:6px}
  .post-info{display:flex;gap:.6rem;flex-wrap:wrap;font-size:.72rem;color:#64748b;margin-bottom:.6rem}
  .post-info span{background:#f1f5f9;padding:.15rem .5rem;border-radius:4px}
  .post-actions{display:flex;gap:.5rem}
  .filter-tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
  .filter-tab{padding:.4rem .9rem;background:#e5e7eb;border:none;border-radius:999px;font-size:.82rem;cursor:pointer;font-weight:600;color:#475569}
  .filter-tab.active{background:#2563eb;color:#fff}
  .empty{text-align:center;padding:3rem 1rem;color:#94a3b8}
  .err{background:#fef2f2;border-left:4px solid #ef4444;padding:.7rem 1rem;border-radius:6px;color:#b91c1c;font-size:.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<h1>📋 投稿モデレーション画面</h1>

<div class="auth-box" id="auth-box">
  <label>運営者シークレット (ADMIN_SECRET)</label>
  <input type="password" id="admin-secret" placeholder="Cloudflare Workerに設定したADMIN_SECRET">
  <button class="btn" onclick="loadPosts()">ログイン＆投稿一覧を表示</button>
  <p style="font-size:.75rem;color:#64748b;margin-top:.5rem">※ 認証情報はブラウザに保存され、このページのみで使われます</p>
</div>

<div id="err-area"></div>

<div class="filter-tabs" id="filter-tabs" style="display:none">
  <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">すべて</button>
  <button class="filter-tab" data-filter="pending" onclick="setFilter('pending')">承認待ち</button>
  <button class="filter-tab" data-filter="approved" onclick="setFilter('approved')">公開中</button>
  <button class="filter-tab" data-filter="rejected" onclick="setFilter('rejected')">却下</button>
</div>

<div id="posts-area"></div>

<script>
const API='https://ito-voice.bmwrllsor-ko.workers.dev';
let allPosts=[];
let currentFilter='all';
let secret='';

// 起動時に保存済みシークレット復元
if(localStorage.getItem('admin_secret')){
  document.getElementById('admin-secret').value=localStorage.getItem('admin_secret');
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

async function loadPosts(){
  secret=document.getElementById('admin-secret').value.trim();
  if(!secret){showErr('シークレットを入力してください');return}
  localStorage.setItem('admin_secret',secret);
  try{
    const res=await fetch(API+'/admin/posts',{headers:{'Authorization':'Bearer '+secret}});
    const data=await res.json();
    if(!data.ok){showErr(data.error||'読み込み失敗');return}
    allPosts=data.posts||[];
    document.getElementById('filter-tabs').style.display='flex';
    document.getElementById('err-area').innerHTML='';
    render();
  }catch(e){showErr('通信エラー: '+e.message)}
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.toggle('active',t.dataset.filter===f));
  render();
}

function render(){
  const area=document.getElementById('posts-area');
  let posts=allPosts;
  if(currentFilter!=='all') posts=posts.filter(p=>p.status===currentFilter);
  if(!posts.length){area.innerHTML='<div class="empty">該当する投稿はありません</div>';return}
  area.innerHTML=posts.map(p=>{
    const typeLabel={good:'👍 良いところ',improve:'💡 改善希望',idea:'💭 アイデア'}[p.postType]||'';
    return `<div class="post ${p.status}">
      <div class="post-head">
        <div>
          <span class="post-status ${p.status}">${p.status}</span>
          <span style="margin-left:.5rem;font-size:.78rem;color:#475569">${esc(typeLabel)} / ${esc(p.category)}</span>
        </div>
        <span class="post-meta">${new Date(p.createdAt).toLocaleString('ja-JP')}</span>
      </div>
      <div class="post-title">${esc(p.title)}</div>
      <div class="post-body">${esc(p.body)}</div>
      <div class="post-info">
        <span>👤 ${esc(p.nickname||'匿名')}</span>
        ${p.age?'<span>🎂 '+esc(p.age)+'</span>':''}
        ${p.area?'<span>📍 '+esc(p.area)+'</span>':''}
        <span>🌐 ${esc(p.ip||'unknown')}</span>
        <span>📱 ${esc((p.userAgent||'').substring(0,40))}...</span>
      </div>
      <div class="post-actions">
        ${p.status!=='approved'?`<button class="btn approve" onclick="moderate('${p.id}','approve')">✅ 公開</button>`:''}
        ${p.status!=='rejected'?`<button class="btn reject" onclick="moderate('${p.id}','reject')">❌ 却下</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function moderate(id,action){
  if(!confirm(action==='approve'?'この投稿を公開しますか？':'この投稿を却下しますか？'))return;
  try{
    const res=await fetch(API+'/admin/moderate',{
      method:'POST',
      headers:{'Authorization':'Bearer '+secret,'Content-Type':'application/json'},
      body:JSON.stringify({id,action}),
    });
    const data=await res.json();
    if(!data.ok){alert('失敗: '+(data.error||'不明'));return}
    await loadPosts();
  }catch(e){alert('通信エラー: '+e.message)}
}

function showErr(m){document.getElementById('err-area').innerHTML='<div class="err">'+esc(m)+'</div>'}

// 起動時自動読み込み
if(document.getElementById('admin-secret').value){loadPosts()}
</script>
</body>
</html>
